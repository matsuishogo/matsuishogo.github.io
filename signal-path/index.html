<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f1c">
  <meta name="description" content="タイルを回して電気をつなぐ、ブラウザで遊べる回路パズル。">
  <title>回路くるり — 回路をつなげ。</title>
  <style>
    :root{color-scheme:dark;--bg:#080f1c;--panel:#121e2e;--edge:#27364b;--muted:#8ea1b8;--text:#f1f7ff;--green:#79f4c0;--aqua:#72d9f0;--orange:#ffc987;--shadow:0 18px 72px #02071475}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100dvh;font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--text);background:radial-gradient(ellipse 80% 30% at 50% -15%,#1c6d75a3,transparent 85%),radial-gradient(ellipse 70% 45% at 100% 80%,#27305e7a,transparent 85%),var(--bg);-webkit-font-smoothing:antialiased}
    body:before{content:"";pointer-events:none;position:fixed;inset:0;opacity:.12;background-image:linear-gradient(#9ac3d617 1px,transparent 1px),linear-gradient(90deg,#9ac3d617 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    button:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
    main{position:relative;max-width:800px;margin:auto;padding:29px 24px 24px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;color:#f1f7ff;letter-spacing:.20em;font-size:13px;font-weight:900}
    .mark{display:grid;place-items:center;width:32px;height:32px;background:#79f4c018;color:#8bffcb;border:1px solid #79f4c080;border-radius:10px;font-size:21px;box-shadow:0 0 25px #79f4c01e}
    .best{font-size:11px;font-weight:800;letter-spacing:.10em;padding:9px 11px;border:1px solid #395066;background:#152235;border-radius:999px;color:#b9cadd;white-space:nowrap}
    .best strong{color:var(--orange);font-size:13px;font-variant-numeric:tabular-nums}
    .intro{padding:31px 0 19px;text-align:center}
    .eyebrow{font-weight:800;font-size:10px;letter-spacing:.35em;color:var(--green)}
    h1{font-size:clamp(33px,7vw,58px);line-height:1.07;letter-spacing:-.07em;margin:13px 0 10px;font-weight:900}
    h1 .thin{font-weight:300;color:#bbcbdd}
    .intro p{margin:0;color:#9db1c5;font-size:13px;line-height:1.8}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:480px;margin:0 auto 17px}
    .stat{padding:12px 6px;border:1px solid #263a4c;background:#122030ba;border-radius:12px;text-align:center}
    .stat span{display:block;color:#91a7bb;font-size:10px;letter-spacing:.08em;font-weight:700}
    .stat strong{display:block;margin-top:4px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
    .stat small{font-size:11px;color:var(--muted);font-weight:500}
    .board-zone{max-width:542px;margin:0 auto;padding:15px 18px 16px;border:1px solid #2c4656;border-radius:23px;background:linear-gradient(145deg,#172b3bde,#0b1829e8);box-shadow:var(--shadow);position:relative;overflow:hidden}
    .board-zone:before{content:"";position:absolute;height:2px;left:20%;right:20%;top:0;background:linear-gradient(90deg,transparent,#83efcb,transparent);box-shadow:0 0 19px #83efcb66}
    .board-labels{display:flex;align-items:center;justify-content:space-between;padding:1px 7px 16px;font-size:10px;letter-spacing:.14em;color:#9cb1c3;font-weight:900}
    .board-labels .signal{display:flex;align-items:center;gap:7px}
    .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#79f4c0;box-shadow:0 0 10px #79f4c0}
    .board-labels .led.out{background:#5b6d82;box-shadow:none}
    .board-labels .led.out.on{background:var(--orange);box-shadow:0 0 11px #ffc987}
    .board-shell{width:min(82%,415px);margin:0 auto;position:relative}
    .board{display:grid;gap:5px;width:100%;aspect-ratio:1;user-select:none;-webkit-user-select:none}
    .tile{position:relative;display:grid;place-items:center;min-width:0;min-height:0;border:1px solid #365063;border-radius:11px;padding:0;background:linear-gradient(155deg,#1a3246,#12263b);color:#7293a7;overflow:hidden;transition:background .2s,border-color .2s,box-shadow .2s,transform .14s}
    .tile:active{transform:scale(.93)}
    .tile svg{display:block;width:100%;height:100%;overflow:visible}
    .tile path{fill:none;stroke:#5f869a;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s,filter .22s}
    .tile circle{fill:#6b92a7;transition:fill .22s}
    .tile.lit{background:linear-gradient(155deg,#1f5a5b,#17444b);border-color:#5dd3b1;box-shadow:inset 0 0 18px #79f4c015,0 0 11px #75f9ca2b}
    .tile.lit path{stroke:#87ffcf;filter:drop-shadow(0 0 7px #4efab6)}
    .tile.lit circle{fill:#edfff5;filter:drop-shadow(0 0 7px #4efab6)}
    .tile.hinted:after{content:"";pointer-events:none;position:absolute;inset:1px;border-radius:10px;border:2px solid #ffc987;animation:hintflash 1s ease-in-out 3}
    .port{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;width:32px;height:30px;transform:translateY(-50%);font-size:16px;font-weight:900;color:var(--green);transition:top .3s}
    .port.left{left:-32px}
    .port.right{right:-32px;color:#8da2b4}
    .port.right.on{color:var(--orange);text-shadow:0 0 10px #ffc987}
    .port:after{content:"";height:3px;position:absolute;top:50%;width:21px;border-radius:4px;background:currentColor;box-shadow:0 0 12px currentColor}
    .port.left:after{right:0}
    .port.right:after{left:0}
    .port b{position:absolute;top:-8px;font-size:14px}
    .port.left b{left:-4px}
    .port.right b{right:-4px}
    .board-caption{margin:13px 0 0;color:#94a9bf;font-size:11px;letter-spacing:.04em;text-align:center;min-height:18px}
    .board-caption .live{color:var(--green);font-weight:700}
    .controls{max-width:542px;display:flex;gap:10px;margin:15px auto 0}
    .control{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;min-height:47px;font-weight:800;font-size:13px;border:1px solid #365067;background:#15283a;color:#d0e1ed;flex:1;transition:background .15s,transform .15s}
    .control:hover{background:#203a50}
    .control:active{transform:scale(.97)}
    .control.primary{background:var(--green);color:#10313a;border-color:transparent;box-shadow:0 9px 30px #79f4c01a}
    .control.primary:hover{background:#a6ffda}
    .control:disabled{opacity:.5;cursor:not-allowed}
    .bottom{margin:17px auto 0;color:#70889e;display:flex;gap:12px;align-items:center;justify-content:center;font-size:10px;letter-spacing:.09em}
    .bottom b{color:#b3c9d7}
    .win-shade{position:absolute;z-index:5;inset:0;border-radius:23px;background:#071420db;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:20px}
    .win-shade.show{display:flex;animation:fadeIn .25s ease}
    .win-card{text-align:center;max-width:360px;width:100%;padding:24px 14px;background:linear-gradient(145deg,#1b3844,#101e30);border:1px solid #6cbfa7;border-radius:20px;box-shadow:0 0 60px #58cf9b24}
    .win-icon{font-size:45px;line-height:1.3;color:var(--green);text-shadow:0 0 24px #79f4c0}
    .win-card h2{font-size:29px;letter-spacing:-.04em;margin:8px 0 8px}
    .win-card p{color:#bacbd7;font-size:12px;line-height:1.8;margin:0 0 15px}
    .win-card .earned{font-size:31px;color:var(--orange);font-weight:900;margin:9px 0 16px}
    .win-card .earned small{font-size:13px;color:#b9cbda}
    .win-card .control{width:100%;margin:auto;max-width:250px}
    @keyframes hintflash{0%,100%{opacity:0}50%{opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @media(max-width:420px){main{padding:19px 15px 25px}.intro{padding:24px 0 16px}.board-zone{padding:14px 11px 14px;border-radius:17px}.board-shell{width:84%}.tile{border-radius:8px}.board{gap:4px}.board-labels{padding:0 10px 13px}.port.left{left:-27px}.port.right{right:-27px}.port{width:27px}.controls{gap:8px}.control{font-size:12px}}
    @media(max-height:720px){.intro{padding:14px 0 12px}.intro h1{font-size:38px}.stats{margin-bottom:10px}.stat{padding:8px 6px}.board-zone{padding-top:10px}.board-shell{width:min(78%,345px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">⌁</span><span>回路くるり</span></div>
      <div class="best">BEST <strong id="best">0</strong> PT</div>
    </header>
    <section class="intro" aria-label="ゲーム概要">
      <div class="eyebrow">A TINY CIRCUIT PUZZLE</div>
      <h1>回路を<span class="thin">つなげ。</span></h1>
      <p>タイルをタップして90°回転。<br>左の電源から右のゴールまで光を届けよう。</p>
    </section>
    <section class="stats" aria-label="プレイ状況">
      <div class="stat"><span>STAGE</span><strong id="level">01</strong></div>
      <div class="stat"><span>ROTATIONS</span><strong id="moves">00</strong></div>
      <div class="stat"><span>TIME</span><strong id="timer">0:00</strong></div>
    </section>
    <section class="board-zone" aria-label="回路パズル">
      <div class="board-labels"><span class="signal"><i class="led"></i>POWER IN</span><span class="signal">GOAL <i class="led out" id="goal-led"></i></span></div>
      <div class="board-shell" id="board-shell">
        <span class="port left" id="source-port" aria-hidden="true"><b>›</b></span>
        <div class="board" id="board" role="group" aria-label="回転できる回路タイル"></div>
        <span class="port right" id="target-port" aria-hidden="true"><b>●</b></span>
      </div>
      <div class="board-caption" aria-live="polite" id="status">すべてのタイルを自由に回せます</div>
      <div class="win-shade" id="win-shade" aria-live="polite">
        <div class="win-card">
          <div class="win-icon" aria-hidden="true">✦</div>
          <h2>CONNECTED!</h2>
          <p id="win-summary">回路がつながりました。</p>
          <div class="earned" id="earned">+500 <small>PTS</small></div>
          <button class="control primary" id="next">次のステージ <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
    <div class="controls">
      <button class="control" id="retry" aria-label="ステージを作り直す">↻ やり直し</button>
      <button class="control" id="hint">✧ ヒント</button>
      <button class="control primary" id="newgame">新しい問題 →</button>
    </div>
    <footer class="bottom"><span>NO INSTALL</span><span>·</span><span>NO ACCOUNT</span><span>·</span><b>JUST PLAY</b></footer>
  </main>
  <script>
    (() => {
      'use strict';
      const dirs = [[-1,0],[0,1],[1,0],[0,-1]]; // N E S W
      const $ = (id) => document.getElementById(id);
      const boardEl = $('board');
      const bestEl = $('best');
      const fmt = (n) => String(n).padStart(2,'0');
      const key = 'signal-path-best-v1';
      let best = 0;
      try { best = Number(localStorage.getItem(key)) || 0; } catch(e) { /* private browsing */ }
      bestEl.textContent = best.toLocaleString('ja-JP');
      let stage = 1, size = 4, startRow = 1, endRow = 2;
      let tiles = [], solution = [], moves = 0, hints = 0, seconds = 0;
      let done = false, stageTimer = null, recentlyHinted = -1;
      const bit = (d) => 1 << d;
      const has = (mask,d) => (mask & bit(d)) !== 0;
      const turn = (mask) => ((mask << 1) & 15) | (mask >> 3);
      const rot = (mask,count) => { for(let i=0;i<count;i++) mask=turn(mask); return mask; };
      const shuffle = (a) => {
        for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
      };
      function makePath(n, sr, er, minLen) {
        const goal = (n-1) + er*n;
        for(let attempt=0; attempt<60; attempt++) {
          const used = new Set(), path = [];
          let visits = 0;
          function walk(r,c) {
            const id = r*n+c;
            if(used.has(id) || ++visits > 22000) return false;
            used.add(id); path.push(id);
            if(id === goal) {
              if(path.length >= minLen) return true;
            } else if(path.length < n*n) {
              const choices = shuffle([0,1,2,3]);
              for(const d of choices) {
                const nr=r+dirs[d][0], nc=c+dirs[d][1];
                if(nr>=0 && nr<n && nc>=0 && nc<n && walk(nr,nc)) return true;
              }
            }
            path.pop(); used.delete(id); return false;
          }
          if(walk(sr,0)) return path;
        }
        // A guaranteed route along the starting row and then down the right edge.
        const path=[];
        for(let col=0;col<n;col++) path.push(sr*n+col);
        const delta=Math.sign(er-sr);
        for(let row=sr+delta; delta && row!==er+delta; row+=delta) path.push(row*n+n-1);
        return path;
      }
      function maskFor(path,index,n) {
        const cur=path[index], r=Math.floor(cur/n), c=cur%n;
        let mask=0;
        for(const adjacent of [index===0?-1:path[index-1],index===path.length-1?-2:path[index+1]]) {
          let d=-1;
          if(adjacent===-1) d=3;
          else if(adjacent===-2) d=1;
          else {
            const ar=Math.floor(adjacent/n),ac=adjacent%n;
            if(ar===r-1) d=0; else if(ac===c+1) d=1; else if(ar===r+1) d=2; else if(ac===c-1) d=3;
          }
          if(d<0) throw new Error('Invalid path');
          mask |= bit(d);
        }
        return mask;
      }
      function generate() {
        size = stage<=2 ? 4 : stage<=6 ? 5 : 6;
        startRow = stage===1 ? 1 : Math.floor(Math.random()*size);
        endRow = stage===1 ? 2 : Math.floor(Math.random()*size);
        const minLen=Math.min(size*size-2,stage===1?5:stage===2?7:size+3+Math.min(stage,5));
        solution=makePath(size,startRow,endRow,minLen);
        tiles=Array.from({length:size*size},(_,id)=>({
          goalMask:0, mask: rot(Math.random()<.55 ? 5 : 3,Math.floor(Math.random()*4)), onPath:false
        }));
        solution.forEach((id,i)=>{
          const m=maskFor(solution,i,size);
          tiles[id]={goalMask:m,mask:rot(m,Math.floor(Math.random()*4)),onPath:true};
        });
        // Avoid an already-solved opening board.
        if(isConnected()) tiles[solution[0]].mask=turn(tiles[solution[0]].mask);
      }
      function isConnected() { return trace().won; }
      function trace() {
        const illuminated = new Set(), queue=[];
        const start=startRow*size;
        if(has(tiles[start].mask,3)) {illuminated.add(start);queue.push(start);}
        let won=false;
        while(queue.length){
          const id=queue.shift(),r=Math.floor(id/size),c=id%size,m=tiles[id].mask;
          if(r===endRow && c===size-1 && has(m,1)) won=true;
          for(let d=0;d<4;d++){
            if(!has(m,d)) continue;
            const nr=r+dirs[d][0],nc=c+dirs[d][1];
            if(nr<0||nr>=size||nc<0||nc>=size) continue;
            const to=nr*size+nc;
            if(!illuminated.has(to) && has(tiles[to].mask,(d+2)%4)){
              illuminated.add(to);queue.push(to);
            }
          }
        }
        return {illuminated,won};
      }
      function tileSvg(mask) {
        const paths = ['M50 50 V0','M50 50 H100','M50 50 V100','M50 50 H0'];
        return `<svg viewBox="0 0 100 100" aria-hidden="true">${paths.map((p,d)=>has(mask,d)?`<path d="${p}"/>`:'').join('')}<circle cx="50" cy="50" r="11"/></svg>`;
      }
      function render() {
        const state=trace();
        boardEl.style.gridTemplateColumns=`repeat(${size},minmax(0,1fr))`;
        boardEl.innerHTML=tiles.map((tile,id)=>`<button type="button" class="tile${state.illuminated.has(id)?' lit':''}${recentlyHinted===id?' hinted':''}" data-id="${id}" aria-label="${Math.floor(id/size)+1}行${id%size+1}列のタイルを回転" ${done?'disabled':''}>${tileSvg(tile.mask)}</button>`).join('');
        $('source-port').style.top=`${(startRow+.5)/size*100}%`;
        $('target-port').style.top=`${(endRow+.5)/size*100}%`;
        $('target-port').classList.toggle('on',state.won);
        $('goal-led').classList.toggle('on',state.won);
        $('level').textContent=fmt(stage);
        $('moves').textContent=fmt(moves);
        $('hint').disabled=done;
        $('retry').disabled=done;
        $('status').innerHTML = state.won ? '<span class="live">✓ SIGNAL CONNECTED</span>' : `通電中 ${state.illuminated.size} / ${size*size} タイル`;
        if(state.won && !done) win();
      }
      function tick() {
        seconds++;
        $('timer').textContent=`${Math.floor(seconds/60)}:${fmt(seconds%60)}`;
      }
      function resetClock() {
        clearInterval(stageTimer);
        seconds=0;$('timer').textContent='0:00';
        stageTimer=setInterval(()=>{if(!document.hidden&&!done)tick();},1000);
      }
      function openStage() {
        done=false;moves=0;hints=0;recentlyHinted=-1;
        $('win-shade').classList.remove('show');
        generate();resetClock();render();
      }
      function win() {
        done=true;clearInterval(stageTimer);
        const points=Math.max(60,Math.round(550+stage*35-moves*12-seconds*2-hints*65));
        if(points>best) {
          best=points;bestEl.textContent=best.toLocaleString('ja-JP');
          try { localStorage.setItem(key,String(best)); } catch(e) { /* storage unavailable */ }
        }
        $('win-summary').textContent=`${moves}回の回転・${seconds}秒でクリア！`;
        $('earned').innerHTML=`+${points.toLocaleString('ja-JP')} <small>PTS</small>`;
        $('win-shade').classList.add('show');
        boardEl.querySelectorAll('button').forEach(b=>b.disabled=true);
        $('hint').disabled=true;$('retry').disabled=true;
      }
      boardEl.addEventListener('click',(e)=>{
        const button=e.target.closest('button[data-id]');
        if(!button||done) return;
        tiles[Number(button.dataset.id)].mask=turn(tiles[Number(button.dataset.id)].mask);
        moves++;recentlyHinted=-1;render();
      });
      $('retry').addEventListener('click',openStage);
      $('newgame').addEventListener('click',()=>{stage++;openStage();});
      $('next').addEventListener('click',()=>{stage++;openStage();});
      $('hint').addEventListener('click',()=>{
        if(done) return;
        const wrong=shuffle(solution.filter(id=>tiles[id].mask!==tiles[id].goalMask));
        if(!wrong.length){$('status').textContent='回路をよく見て、つながりを確認してみよう';return;}
        const id=wrong[0];tiles[id].mask=tiles[id].goalMask;
        hints++;recentlyHinted=id;render();
      });
      openStage();
    })();
  </script>
</body>
</html>
