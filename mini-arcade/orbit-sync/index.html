<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a101e"><title>ORBIT SYNC | Pocket Arcade</title><link rel="stylesheet" href="../theme.css"><style>.orb{width:min(100%,530px);margin:auto;display:block;cursor:pointer;touch-action:manipulation;border-radius:16px;background:radial-gradient(circle at 50% 50%,#192a42,#0a1222 74%)}.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:16px auto 0}.big{min-width:175px;font-size:16px}.health{letter-spacing:5px;color:#ffb9b8}.center{text-align:center}.key{display:inline-block;border:1px solid #42566f;border-radius:6px;padding:2px 8px;font-size:11px;color:#b5c6df}.meter{height:6px;border-radius:8px;background:#22334b;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:linear-gradient(90deg,#6cf3d1,#8eb6ff);transition:width .2s}</style></head><body><div class="wrap"><header class="top"><a class="back" href="../">← 5つのゲームへ戻る</a><span class="tag">02 / TIMING</span></header><div class="gamehead"><p class="eyebrow">ONE TAP. PERFECT TIMING.</p><h1 class="game-title">ORBIT SYNC</h1><p class="game-sub">回る光をターゲットへ。重なる瞬間にタップ。3回ミスすると終了。</p></div><main class="gameboard"><div class="stats"><div class="stat"><b id="round">1 / 8</b><small>ROUND</small></div><div class="stat"><b id="score">0</b><small>SCORE</small></div><div class="stat"><b id="best">0</b><small>BEST</small></div><div class="stat"><b id="lives" class="health">♥♥♥</b><small>CHANCES</small></div></div><canvas id="orbit" class="orb" width="520" height="370" role="button" tabindex="0" aria-label="軌道をクリックしてタイミングを合わせる"></canvas><div class="meter"><div class="fill" id="progress"></div></div><div class="controls"><button class="btn primary big" id="fire">◎ 今だ！</button><button class="btn" id="again">最初から ↺</button></div><div class="notice center" id="notice" role="status" aria-live="polite">光がゲートを通過する瞬間にタップ！</div></main><p class="footer">画面タップ、ボタン、スペースキーで操作できます。</p></div><script>
(function(){
'use strict';
var canvas=document.getElementById('orbit'),ctx=canvas.getContext('2d');
var round=1,score=0,best=0,lives=3,angle=0,target=-Math.PI/2,speed=1.4,done=false,last=0,flash=0,flashColor='#6cf3d1';
var el=function(id){return document.getElementById(id);};
try{best=Number(localStorage.getItem('pocket-orbit-best'))||0;}catch(e){}
function newTarget(){target=-Math.PI+Math.random()*Math.PI*2;}
function update(){el('round').textContent=Math.min(round,8)+' / 8';el('score').textContent=score;el('best').textContent=best;el('lives').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);el('progress').style.width=Math.min(100,(round-1)/8*100)+'%';el('fire').disabled=done;}
function reset(){round=1;score=0;lives=3;angle=-Math.PI/2;speed=1.4;done=false;flash=0;newTarget();last=0;el('notice').textContent='光がゲートを通過する瞬間にタップ！';update();}
function hit(){if(done)return;var diff=Math.abs(Math.atan2(Math.sin(angle-target),Math.cos(angle-target)));flash=0.22;
if(diff<0.25){var perfect=diff<0.07;var earned=perfect?180:100;score+=earned;flashColor='#6cf3d1';el('notice').textContent=(perfect?'✦ PERFECT!':'✓ NICE!')+' +'+earned+'点';round++;angle=angle%(Math.PI*2);speed=1.4+(round-1)*0.28;newTarget();if(round>8){done=true;el('notice').textContent='MISSION COMPLETE! '+score+'点。もう一度挑戦しよう。';el('progress').style.width='100%';}}
else{lives--;flashColor='#ff7497';el('notice').textContent='惜しい！ゲートから '+Math.round(diff*180/Math.PI)+'° ずれていた。';if(lives<=0){done=true;el('notice').textContent='GAME OVER · '+score+'点。やり直してみよう。';}}
if(done&&score>best){best=score;try{localStorage.setItem('pocket-orbit-best',String(best));}catch(e){}}
update();}
function circle(cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);}
function render(t){if(!last)last=t;var dt=Math.min(.05,(t-last)/1000);last=t;if(!done&&!document.hidden){angle=(angle+dt*speed)%(2*Math.PI);}flash=Math.max(0,flash-dt);var w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=120;
ctx.clearRect(0,0,w,h);ctx.save();for(var i=0;i<36;i++){var x=(i*131+37)%w,y=(i*97+19)%h;ctx.fillStyle=i%6?'#233950':'#4c667e';ctx.fillRect(x,y,1.5,1.5);}
ctx.strokeStyle='#283c55';ctx.lineWidth=1;for(var k=48;k<=170;k+=42){circle(cx,cy,k);ctx.stroke();}
circle(cx,cy,r);ctx.strokeStyle='#45607b';ctx.lineWidth=4;ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,r,target-.24,target+.24);ctx.lineWidth=18;ctx.strokeStyle='#6cf3d1';ctx.lineCap='round';ctx.stroke();
ctx.beginPath();ctx.arc(cx,cy,r,target-.085,target+.085);ctx.lineWidth=22;ctx.strokeStyle='#f9d487';ctx.stroke();
var px=cx+Math.cos(angle)*r,py=cy+Math.sin(angle)*r;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.strokeStyle='#6aabda';ctx.lineWidth=2;ctx.stroke();
circle(cx,cy,8);ctx.fillStyle='#a7bff0';ctx.fill();
circle(px,py,12);ctx.shadowColor='#88cfff';ctx.shadowBlur=24;ctx.fillStyle='#b8e8ff';ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#dae8fb';ctx.textAlign='center';ctx.font='800 13px sans-serif';ctx.fillText(done?'COMPLETE':'ORBIT // '+String(round).padStart(2,'0'),cx,cy+38);
if(flash>0){ctx.globalAlpha=Math.min(.46,flash*1.5);ctx.fillStyle=flashColor;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1;}
ctx.restore();requestAnimationFrame(render);}
el('fire').addEventListener('click',hit);canvas.addEventListener('click',hit);canvas.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit();}});
document.addEventListener('keydown',function(e){if(e.code==='Space'&&e.target!==canvas&&e.target.tagName!=='BUTTON'){e.preventDefault();hit();}});
el('again').addEventListener('click',reset);document.addEventListener('visibilitychange',function(){last=0;});
reset();requestAnimationFrame(render);
})();
</script></body></html>
