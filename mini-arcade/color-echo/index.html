<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a101e"><title>COLOR ECHO | Pocket Arcade</title><link rel="stylesheet" href="../theme.css"><style>.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;width:min(100%,410px);margin:20px auto}.color{height:clamp(115px,29vw,168px);border:2px solid transparent;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#fff;font-size:24px;font-weight:900;opacity:.7;transition:opacity .12s,transform .12s,box-shadow .12s}.color span{font-size:12px;font-weight:800;letter-spacing:.1em}.color[data-n="0"]{background:#168f79;border-color:#53cfb6}.color[data-n="1"]{background:#3b66ca;border-color:#86afff}.color[data-n="2"]{background:#a13e77;border-color:#f58abf}.color[data-n="3"]{background:#b17a1c;border-color:#f3be58}.color.active{opacity:1;box-shadow:0 0 24px currentColor;transform:scale(1.035)}.colors.waiting .color{opacity:.53}.colors.waiting .color.active{opacity:1}.controls{justify-content:center;margin:18px auto 6px}.subline{font-size:12px;color:#bdcde3;text-align:center;line-height:1.6}@media(prefers-reduced-motion:reduce){.color{transition:none}}</style></head><body><div class="wrap"><header class="top"><a class="back" href="../">← 5つのゲームへ戻る</a><span class="tag">04 / MEMORY</span></header><div class="gamehead"><p class="eyebrow">WATCH. REMEMBER. REPEAT.</p><h1 class="game-title">COLOR ECHO</h1><p class="game-sub">光る色の順番を覚えて、同じ順番でタップ。どこまで覚えられる？</p></div><main class="gameboard"><div class="stats"><div class="stat"><b id="level">0</b><small>ROUND</small></div><div class="stat"><b id="score">0</b><small>POINTS</small></div><div class="stat"><b id="best">0</b><small>BEST ROUND</small></div></div><p class="subline">色が順番に点灯 → あなたが同じ順番で押す</p><div class="colors waiting" id="colors" role="group" aria-label="色のパネル"><button type="button" class="color" data-n="0" aria-label="みどり">◆<span>GREEN</span></button><button type="button" class="color" data-n="1" aria-label="あお">●<span>BLUE</span></button><button type="button" class="color" data-n="2" aria-label="ピンク">✦<span>PINK</span></button><button type="button" class="color" data-n="3" aria-label="きいろ">▲<span>YELLOW</span></button></div><div class="row controls"><button class="btn primary" type="button" id="start">スタート ▶</button><button class="btn" type="button" id="sound">音：ON ♪</button></div><div class="notice" id="message" role="status" aria-live="polite">スタートを押してチャレンジ。</div></main><p class="footer">ラウンドが進むほど、順番が1つ増えます。音が出ない環境でも遊べます。</p></div><script>
(function(){
'use strict';
var seq=[],pos=0,level=0,score=0,best=0,locked=true,done=true,run=0,sound=true,audio=null;
var colors=document.getElementById('colors'),btns=[].slice.call(colors.querySelectorAll('button')),el=function(id){return document.getElementById(id);};
try{best=Number(localStorage.getItem('pocket-echo-best'))||0;}catch(e){}
function sync(){el('level').textContent=level;el('score').textContent=score;el('best').textContent=best;colors.classList.toggle('waiting',locked);}
function beep(n){if(!sound)return;try{var Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audio)audio=new Audio();if(audio.state==='suspended')audio.resume();var osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=[330,440,550,660][n];osc.connect(gain);gain.connect(audio.destination);gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.085,audio.currentTime+.018);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.2);osc.start();osc.stop(audio.currentTime+.22);}catch(e){}}
function light(n,ms){btns[n].classList.add('active');beep(n);setTimeout(function(){btns[n].classList.remove('active');},ms);}
function playback(id){if(id!==run||done)return;locked=true;sync();el('message').textContent='光る順番を覚えてね…';seq.forEach(function(n,i){setTimeout(function(){if(id===run&&!done)light(n,380);},i*630+400);});setTimeout(function(){if(id!==run||done)return;locked=false;pos=0;sync();el('message').textContent='あなたの番！ '+seq.length+'つの色を順にタップ。';},seq.length*630+450);}
function next(){level++;seq.push(Math.floor(Math.random()*4));sync();playback(run);}
function start(){run++;seq=[];pos=0;level=0;score=0;done=false;locked=true;btns.forEach(function(b){b.classList.remove('active');});el('start').textContent='最初から ↺';sync();setTimeout(function(){if(!done)next();},300);}
function press(n){if(locked||done)return;light(n,230);if(seq[pos]!==n){done=true;locked=true;run++;sync();el('message').textContent='残念！ ラウンド '+level+' で失敗。リトライしよう。';el('start').textContent='リトライ ↺';return;}
pos++;if(pos===seq.length){locked=true;score+=level*100;if(level>best){best=level;try{localStorage.setItem('pocket-echo-best',String(best));}catch(e){}}sync();if(level>=12){done=true;el('message').textContent='✦ AMAZING! 12ラウンド完全クリア！';return;}el('message').textContent='✓ 正解！ 次のラウンドへ。';var id=run;setTimeout(function(){if(id===run&&!done)next();},850);}else{el('message').textContent='いい感じ！ あと '+(seq.length-pos)+' 色。';}}
btns.forEach(function(b){b.addEventListener('click',function(){press(Number(b.dataset.n));});});
el('start').addEventListener('click',start);el('sound').addEventListener('click',function(){sound=!sound;el('sound').textContent='音：'+(sound?'ON ♪':'OFF');});sync();
})();
</script></body></html>
