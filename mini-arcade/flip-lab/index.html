<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a101e"><title>FLIP LAB | Pocket Arcade</title><link rel="stylesheet" href="../theme.css"><style>.lampgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;width:min(100%,430px);margin:22px auto}.lamp{aspect-ratio:1;border-radius:14px;border:1px solid #334863;background:#14243a;position:relative;transition:background .12s,transform .1s;min-height:44px;box-shadow:inset 0 2px 6px #06101c}.lamp:after{content:'';position:absolute;inset:21%;border-radius:50%;background:#35455d}.lamp.on{background:#265d62;border-color:#75ecda;box-shadow:0 0 18px #2af3ae29,inset 0 0 18px #0d5455}.lamp.on:after{background:#9affdf;box-shadow:0 0 16px #6cf3d1}.lamp.focus{border:3px solid #f9d487;outline:2px solid #f9d487;outline-offset:2px}.lamp:active{transform:scale(.93)}.center{text-align:center}.controls{justify-content:center;margin:16px 0}.rule{font-size:12px;color:#b7c8e1;text-align:center;line-height:1.7}@media(max-width:420px){.lampgrid{gap:6px}.lamp{border-radius:10px}}</style></head><body><div class="wrap"><header class="top"><a class="back" href="../">← 5つのゲームへ戻る</a><span class="tag">03 / PUZZLE</span></header><div class="gamehead"><p class="eyebrow">TURN EVERYTHING OFF.</p><h1 class="game-title">FLIP LAB</h1><p class="game-sub">タイルを押すと上下左右も反転。すべてのライトを消せるかな？</p></div><main class="gameboard"><div class="stats"><div class="stat"><b id="on">0</b><small>LIGHTS ON</small></div><div class="stat"><b id="moves">0</b><small>MOVES</small></div><div class="stat"><b id="best">—</b><small>BEST (NO HINTS)</small></div></div><p class="rule">点灯しているライトを、すべて消そう。<br>点灯したマスも消灯したマスも押せます。</p><div id="board" class="lampgrid" role="group" aria-label="ライトパズル 5×5"></div><div class="row controls"><button id="new" class="btn primary" type="button">新しい問題 ↺</button><button id="hint" class="btn" type="button">ヒント ✦</button></div><div class="notice center" id="message" aria-live="polite" role="status">いずれかのタイルをタップして開始。</div></main><p class="footer">解ける問題だけを自動生成します。ヒントを使った回は記録対象外。</p></div><script>
(function(){
'use strict';
var N=5,S=N*N,board=[],moves=0,hints=0,done=false,best=0,highlight=-1;
var el=function(id){return document.getElementById(id);},tiles=[];
try{best=Number(localStorage.getItem('pocket-flip-best'))||0;}catch(e){}
function adjacent(a,b){var ax=a%N,ay=Math.floor(a/N),bx=b%N,by=Math.floor(b/N);return Math.abs(ax-bx)+Math.abs(ay-by)<=1;}
function change(i){for(var j=0;j<S;j++)if(adjacent(i,j))board[j]^=1;}
function paint(){var on=0;board.forEach(function(v,i){tiles[i].classList.toggle('on',Boolean(v));tiles[i].classList.toggle('focus',i===highlight);tiles[i].setAttribute('aria-label',(Math.floor(i/N)+1)+'行'+(i%N+1)+'列 '+(v?'点灯':'消灯'));on+=v;});el('on').textContent=on;el('moves').textContent=moves;el('best').textContent=best?best+'回':'—';el('hint').disabled=done;return on;}
function click(i){if(done)return;highlight=-1;change(i);moves++;var on=paint();if(!on){done=true;el('hint').disabled=true;el('message').textContent='✦ 全消灯！ '+moves+'回でクリア。'+(hints?'（ヒント使用）':'');if(!hints&&(!best||moves<best)){best=moves;try{localStorage.setItem('pocket-flip-best',String(best));}catch(e){}paint();}}else el('message').textContent='残り'+on+'個。じっくり考えてみよう。';}
function solve(){var mat=[];for(var r=0;r<S;r++){var row=new Uint8Array(S+1);for(var c=0;c<S;c++)row[c]=adjacent(r,c)?1:0;row[S]=board[r];mat.push(row);}var pivotCols=[],rowNo=0;for(var col=0;col<S&&rowNo<S;col++){var pivot=rowNo;while(pivot<S&&!mat[pivot][col])pivot++;if(pivot===S)continue;var tmp=mat[pivot];mat[pivot]=mat[rowNo];mat[rowNo]=tmp;for(var k=0;k<S;k++)if(k!==rowNo&&mat[k][col])for(var j=col;j<=S;j++)mat[k][j]^=mat[rowNo][j];pivotCols.push(col);rowNo++;}
for(var j=rowNo;j<S;j++){if(mat[j][S])return null;}var ans=new Uint8Array(S);for(var i=rowNo-1;i>=0;i--){var v=mat[i][S];for(var k=pivotCols[i]+1;k<S;k++)v^=mat[i][k]&ans[k];ans[pivotCols[i]]=v;}return ans;}
function hint(){if(done)return;var sol=solve();if(!sol){el('message').textContent='ヒントを計算できませんでした。';return;}var idx=Array.from(sol).findIndex(function(v){return v===1;});if(idx<0)return;highlight=idx;hints++;paint();el('message').textContent='黄色い枠のマスをタップすると、解決に近づきます。';}
function reset(){board=Array(S).fill(0);moves=0;hints=0;done=false;highlight=-1;var pressCount=9+Math.floor(Math.random()*7);for(var i=0;i<pressCount;i++)change(Math.floor(Math.random()*S));if(board.every(function(v){return v===0;}))change(12);paint();el('message').textContent='すべてのライトを消そう。';}
for(var i=0;i<S;i++){var b=document.createElement('button');b.type='button';b.className='lamp';(function(n){b.addEventListener('click',function(){click(n);});})(i);tiles.push(b);el('board').append(b);}
el('new').addEventListener('click',reset);el('hint').addEventListener('click',hint);reset();
})();
</script></body></html>
