<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a101e"><title>ROUTE ZERO | Pocket Arcade</title><link rel="stylesheet" href="../theme.css"><style>.routegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:min(100%,475px);margin:20px auto}.tile{aspect-ratio:1;min-width:0;min-height:46px;border:1px solid #374c66;border-radius:12px;background:#17263c;color:#d6e8fb;font-size:clamp(19px,5vw,28px);font-weight:900;position:relative}.tile.low{background:#173d41;color:#a4f6d7}.tile.mid{background:#253448}.tile.high{background:#533846;color:#ffc2a6}.tile.path{background:#51857f!important;color:#081c27;border-color:#adfbe8!important;box-shadow:0 0 0 2px #75e4d655 inset}.tile.now{outline:3px solid #fbe59c;outline-offset:1px}.tile.legal{border-style:dashed;border-color:#7faed0}.tile.hint{box-shadow:0 0 0 3px #f8d475 inset}.tile:disabled{opacity:1;cursor:default}.tile small{position:absolute;left:5px;bottom:4px;font-size:8px;letter-spacing:.04em}.tile.start{background:#36566a;color:#fff}.tile.goal{background:#314d82;color:#fff}.bar{display:flex;justify-content:center;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11px;color:#b6c7dd}.legend strong{color:#fff}.result{font-size:15px;text-align:center;color:#c7eadd;margin-top:11px;min-height:23px}</style></head><body><div class="wrap"><header class="top"><a class="back" href="../">← 5つのゲームへ戻る</a><span class="tag">05 / STRATEGY</span></header><div class="gamehead"><p class="eyebrow">THE SHORTEST WAY ISN'T ALWAYS OBVIOUS.</p><h1 class="game-title">ROUTE ZERO</h1><p class="game-sub">左上のSTARTから右下のGOALへ。通るマスの数字を足して、最小コストを狙おう。</p></div><main class="gameboard"><div class="stats"><div class="stat"><b id="spent">0</b><small>YOUR COST</small></div><div class="stat"><b id="optimal">0</b><small>OPTIMAL</small></div><div class="stat"><b id="moves">0</b><small>STEPS</small></div><div class="stat"><b id="best">—</b><small>BEST GAP</small></div></div><div class="legend"><span>🟢 <strong>1–3</strong> 安い</span><span>⚪ <strong>4–6</strong> 普通</span><span>🔴 <strong>7–9</strong> 高い</span></div><div id="grid" class="routegrid" role="group" aria-label="コスト付きの5行5列のマス"></div><div id="result" class="result" aria-live="polite"></div><div class="bar"><button class="btn" id="undo" type="button">↶ 1手戻す</button><button class="btn" id="retry" type="button">やり直す</button><button class="btn" id="hint" type="button">ヒント ✦</button><button class="btn primary" id="next" type="button">次の問題 ↗</button></div><div class="notice" id="message" role="status" aria-live="polite">スタートの上下左右のマスを選んで進もう。</div></main><p class="footer">上下左右に移動できます。同じマスは2度通れません。どの問題にも最適経路が存在します。</p></div><script>
(function(){
'use strict';
var W=5,S=25,values=[],path=[0],opt=0,best=null,finished=false,hinted=-1;
var el=function(id){return document.getElementById(id);},cells=[];
try{var b=localStorage.getItem('pocket-route-gap');if(b!==null){best=Number(b);if(!Number.isFinite(best))best=null;}}catch(e){}
function adj(a,b){return Math.abs(a%W-b%W)+Math.abs(Math.floor(a/W)-Math.floor(b/W))===1;}
function neighbors(id){var n=[];for(var j=0;j<S;j++)if(adj(id,j))n.push(j);return n;}
function shortest(start,banned){var dist=Array(S).fill(Infinity),prev=Array(S).fill(-1),used=Array(S).fill(false);dist[start]=0;for(var t=0;t<S;t++){var u=-1;for(var i=0;i<S;i++)if(!used[i]&&!(banned&&banned.has(i))&&(u===-1||dist[i]<dist[u]))u=i;if(u===-1||dist[u]===Infinity)break;used[u]=true;for(var j of neighbors(u)){if(used[j]||(banned&&banned.has(j)))continue;var d=dist[u]+values[j];if(d<dist[j]){dist[j]=d;prev[j]=u;}}}var route=[];if(dist[S-1]<Infinity){var c=S-1;while(c!==start&&c!==-1){route.push(c);c=prev[c];}route.push(start);route.reverse();}return {cost:dist[S-1],route:route};}
function sum(){return path.slice(1).reduce(function(s,i){return s+values[i];},0);}
function render(){var current=path[path.length-1],cost=sum();el('spent').textContent=cost;el('optimal').textContent=opt;el('moves').textContent=path.length-1;el('best').textContent=best===null?'—':(best===0?'PERFECT':'+'+best);cells.forEach(function(b,i){var visited=path.includes(i),legal=!finished&&!visited&&adj(i,current);b.className='tile '+(values[i]<=3?'low':values[i]<=6?'mid':'high')+(i===0?' start':'')+(i===S-1?' goal':'')+(visited?' path':'')+(i===current?' now':'')+(legal?' legal':'')+(i===hinted?' hint':'');b.innerHTML='';b.textContent=i===0?'S':i===S-1?'G':String(values[i]);var small=document.createElement('small');small.textContent=i===0?'START':i===S-1?'GOAL':'';b.append(small);b.disabled=!legal;b.setAttribute('aria-label',(i===0?'スタート':i===S-1?'ゴール ':'' )+(Math.floor(i/W)+1)+'行'+(i%W+1)+'列 コスト'+(i===0?'0':values[i])+(visited?' 通過済み':'')+(legal?' 移動可能':''));});el('undo').disabled=finished||path.length===1;el('hint').disabled=finished;el('next').disabled=!finished;}
function step(i){var cur=path[path.length-1];if(finished||path.includes(i)||!adj(cur,i))return;path.push(i);hinted=-1;if(i===S-1){finished=true;var cost=sum(),gap=cost-opt;var rank=gap===0?'★★★ PERFECT!':gap<=4?'★★ GREAT!':'★ CLEAR!';el('result').textContent=rank;if(best===null||gap<best){best=gap;try{localStorage.setItem('pocket-route-gap',String(best));}catch(e){}}el('message').textContent='ゴール！ あなたのコスト '+cost+' / 最小 '+opt+'（差 +'+gap+'）';}
else{el('message').textContent='現在 '+sum()+'。数字の小さいマスを選んでみよう。';}
render();}
function newGame(){values=Array.from({length:S},function(){return 1+Math.floor(Math.random()*9);});values[0]=0;path=[0];finished=false;hinted=-1;opt=shortest(0,new Set()).cost;el('result').textContent='';el('message').textContent='SからGへ。最小コスト '+opt+' を目指そう！';render();}
function undo(){if(finished||path.length<=1)return;path.pop();hinted=-1;el('message').textContent='1手戻しました。';render();}
function retry(){path=[0];finished=false;hinted=-1;el('result').textContent='';el('message').textContent='同じマップでもう一度！';render();}
function hint(){if(finished)return;var banned=new Set(path.slice(0,-1)),cur=path[path.length-1],solution=shortest(cur,banned);if(solution.route.length<2){el('message').textContent='ゴールへ行ける道がありません。「1手戻す」を試してね。';return;}hinted=solution.route[1];el('message').textContent='黄色い枠のマスが、現在地からの最安ルートです。';render();}
for(var i=0;i<S;i++){var b=document.createElement('button');b.type='button';(function(n){b.addEventListener('click',function(){step(n);});})(i);cells.push(b);el('grid').append(b);}
el('undo').addEventListener('click',undo);el('retry').addEventListener('click',retry);el('hint').addEventListener('click',hint);el('next').addEventListener('click',newGame);newGame();
})();
</script></body></html>
